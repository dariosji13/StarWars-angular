name: Build & Deploy QA
on:
  push:
    branches:
      - qa
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🏗️ Build QA
        run: npm run build swapi-frontend --  --base-href "/StarWars-angular/"
      - name: 🔄 Fix SPA routing for GitHub Pages
        run: cp dist/swapi-frontend/browser/index.html dist/swapi-frontend/browser/404.html
      - name: 🔍 Validate build output
        run: |
          echo "📁 Contenido de dist/swapi-frontend/browser:"
          ls -R dist/swapi-frontend/browser
      - name: 📤 Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/swapi-frontend/browser
  deploy:
    environment:
      name: qa
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages (QA)
        id: deployment
        uses: actions/deploy-pages@v4