name: Deploy Producción

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación Producción
        run: npm run build -- --configuration=production --base-href "https://dariosji13.github.io/StarWars-angular/"

      - name: Desplegar a GitHub Pages (raíz del proyecto)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/swapi-frontend/browser
          clean: true
