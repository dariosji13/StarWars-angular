<div class="container">
  <h2>Buscar personaje de Star Wars 🔎</h2>

  <form (ngSubmit)="searchCharacter()">
    <input
      type="text"
      [(ngModel)]="searchName"
      name="searchName"
      placeholder="Ej: Luke Skywalker"
      required
    />
    <button type="submit">Buscar</button>
  </form>

  <div *ngIf="loading">Cargando...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="character">
    <h3>{{ character.name }}</h3>
    <p><strong>Altura:</strong> {{ character.height }} cm</p>
    <p><strong>Peso:</strong> {{ character.mass }} kg</p>
    <p><strong>Color de cabello:</strong> {{ character.hair_color }}</p>
    <p><strong>Color de piel:</strong> {{ character.skin_color }}</p>

    <div *ngIf="character.vehicles?.length">
      <h4>Vehículos:</h4>
      <ul>
        <li *ngFor="let vehicle of character.vehicles">{{ vehicle.name }}</li>
      </ul>
    </div>
  </div>
</div>
